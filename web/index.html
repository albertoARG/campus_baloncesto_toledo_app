  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">

  </picture>
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>

  <script>
    // Aviso de "nueva versión disponible": detecta cuando el service worker
    // ha descargado una versión nueva y ofrece recargar.
    (function () {
      if (!('serviceWorker' in navigator)) return;

      function showUpdateBanner() {
        if (document.getElementById('update-banner')) return;
        var bar = document.createElement('div');
        bar.id = 'update-banner';
        bar.style.cssText =
          'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);' +
          'z-index:99999;background:#5E35B1;color:#fff;padding:10px 14px;' +
          'border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;' +
          'align-items:center;gap:12px;font-family:sans-serif;font-size:14px;max-width:92%;';
        var msg = document.createElement('span');
        msg.textContent = 'Hay una nueva versión disponible';
        var btn = document.createElement('button');
        btn.textContent = 'Actualizar';
        btn.style.cssText =
          'background:#fff;color:#5E35B1;border:none;border-radius:8px;' +
          'padding:6px 12px;font-weight:bold;cursor:pointer;font-size:14px;';
        btn.onclick = function () {
          btn.textContent = 'Actualizando…';
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () { location.reload(); })
            .catch(function () { location.reload(); });
        };
        bar.appendChild(msg);
        bar.appendChild(btn);
        document.body.appendChild(bar);
      }

      navigator.serviceWorker.ready.then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner();
            }
          });
        });
        // Comprobar periódicamente y al volver a la pestaña.
        setInterval(function () { reg.update(); }, 60000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch(function () {});
    })();
  </script>

</body></html>
